<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>메일 명함 생성기</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-REQY4913H3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-REQY4913H3");
  </script>

  <!-- Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .wrap {
      max-width: 1700px;
      margin: 24px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 410px 1fr;
      gap: 24px;
      align-items: start;
    }

    .panel, .preview {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
      padding: 20px;
    }

    h1 { margin: 0 0 18px; font-size: 24px; }

    .field { margin-bottom: 14px; }

    .field label {
      display:block;
      font-size:14px;
      margin-bottom:6px;
      font-weight:700;
    }

    .field input, .field select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
      font-family: inherit;
    }

    .two {
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }

    .btn-row {
      display:flex;
      gap:10px;
      margin-top:14px;
      flex-wrap:wrap;
    }

    button {
      border:0;
      border-radius:10px;
      padding:12px 16px;
      cursor:pointer;
      font-size:14px;
      font-weight:700;
      font-family: inherit;
    }

    .btn-primary { background:#0f4c81; color:#fff; }
    .btn-secondary { background:#e5e7eb; color:#111827; }

    .preview-title {
      margin:0 0 14px;
      font-size:18px;
      font-weight:700;
    }

    .preview canvas {
      width:100%;
      height:auto;
      border:1px solid #ddd;
      background:#fff;
    }

    .char-preview {
      height:110px;
      border:1px solid #d0d7de;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-top:8px;
      background:#fff;
    }

    .char-preview img {
      max-width:90px;
      max-height:90px;
      object-fit:contain;
    }

    .range-field {
      margin:18px 0;
      padding-top: 4px;
    }

    .range-field > label {
      display:block;
      font-size:14px;
      margin-bottom:8px;
      font-weight:700;
    }

    .range-row {
      display:grid;
      grid-template-columns:42px 1fr 52px;
      gap:8px;
      align-items:center;
      font-size:13px;
      margin-top:8px;
    }

    .range-row input { width:100%; }

    .check-group {
      margin: 16px 0;
      padding: 12px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      background: #fafafa;
    }

    .check-group-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .check-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
      font-size: 13px;
    }

    .check-grid label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .help {
      margin-top:14px;
      font-size:13px;
      color:#666;
      line-height:1.55;
    }

    @media (max-width:1100px) {
      .wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="panel">
      <h1>메일 명함 생성기</h1>

      <div class="field">
        <label for="logoType">상단 로고</label>
        <select id="logoType">
          <option value="erica">한양대학교 ERICA</option>
          <option value="hanyang">한양대</option>
          <option value="none">로고 없음</option>
        </select>
      </div>

      <div class="field">
        <label for="name">이름</label>
        <input id="name" type="text" value="하냥이" />
      </div>

      <div class="field">
        <label for="title">직급</label>
        <input id="title" type="text" value="귀여움" />
      </div>

      <div class="field">
        <label for="team">팀명 / 소속</label>
        <input id="team" type="text" value="한양대학교 ERICA 하냥처 | 하냥팀" />
      </div>

      <div class="field">
        <label for="email">이메일</label>
        <input id="email" type="text" value="hanyangi@hanyang.ac.kr" />
      </div>

      <div class="field">
        <label for="phone">전화번호</label>
        <input id="phone" type="text" value="031-400-9999" />
      </div>

      <div class="field">
        <label for="address">사무실 주소</label>
        <input id="address" type="text" value="경기도 안산시 상록구 한양대학로 55 한양대학교 ERICA 캣타워" />
      </div>

      <div class="check-group">
        <div class="check-group-title">글자 굵기 설정</div>
        <div class="check-grid">
          <label><input id="boldName" type="checkbox" checked> 이름 굵게</label>
          <label><input id="boldTitle" type="checkbox" checked> 직급 굵게</label>
          <label><input id="boldTeam" type="checkbox" checked> 소속 굵게</label>
          <label><input id="boldContact" type="checkbox" checked> 연락처 굵게</label>
          <label><input id="boldAddress" type="checkbox" checked> 주소 굵게</label>
        </div>
      </div>

      <div class="two">
        <div class="field">
          <label for="category">캐릭터 분류</label>
          <select id="category">
            <option value="all">전체</option>
            <option value="hanyangi">하냥이</option>
            <option value="college">단과대학</option>
            <option value="hibibi">하이비비</option>
          </select>
        </div>

        <div class="field">
          <label for="character">캐릭터</label>
          <select id="character"></select>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-secondary" id="prevBtn" type="button">이전</button>
        <button class="btn-secondary" id="nextBtn" type="button">다음</button>
      </div>

      <div class="char-preview">
        <img id="charPreview" alt="캐릭터 미리보기" />
      </div>

      <div class="help" id="charCountInfo"></div>

      <div class="range-field">
        <label>이름 위치/크기 미세조정</label>
        <div class="range-row">
          <span>좌우</span>
          <input id="nameOffsetX" type="range" min="-200" max="200" value="0" />
          <span id="nameOffsetXValue">0</span>
        </div>
        <div class="range-row">
          <span>상하</span>
          <input id="nameOffsetY" type="range" min="-120" max="120" value="0" />
          <span id="nameOffsetYValue">0</span>
        </div>
        <div class="range-row">
          <span>크기</span>
          <input id="nameScale" type="range" min="60" max="140" value="100" />
          <span id="nameScaleValue">100</span>
        </div>
      </div>

      <div class="range-field">
        <label>캐릭터 위치/크기 미세조정</label>
        <div class="range-row">
          <span>좌우</span>
          <input id="charOffsetX" type="range" min="-250" max="250" value="0" />
          <span id="charOffsetXValue">0</span>
        </div>
        <div class="range-row">
          <span>상하</span>
          <input id="charOffsetY" type="range" min="-250" max="250" value="0" />
          <span id="charOffsetYValue">0</span>
        </div>
        <div class="range-row">
          <span>크기</span>
          <input id="charScale" type="range" min="40" max="160" value="100" />
          <span id="charScaleValue">100</span>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="downloadBtn" type="button">PNG 다운로드</button>
        <button class="btn-secondary" id="resetBtn" type="button">기본값 복원</button>
      </div>

      <div class="help">
        Pretendard 적용 / 글자별 굵기 설정 / 다운로드 이벤트 추적 포함 버전.
      </div>
    </div>

    <div class="preview">
      <p class="preview-title">미리보기</p>
      <canvas id="canvas" width="2048" height="706"></canvas>
    </div>
  </div>

  <script>
    const FONT_FAMILY = '"Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif';

    const CONFIG = {
      width: 2048,
      height: 706,

      logos: {
        erica: { src: "assets/logos/hyu_erica.png", x: 1642, y: 54, w: 340, h: 70 },
        hanyang: { src: "assets/logos/hyu.png", x: 1666, y: 56, w: 300, h: 72 }
      },

      name: { x: 120, y: 142, maxWidth: 610, startSize: 142, minSize: 56, color: "#0f4c81" },
      title: { x: 725, y: 236, maxWidth: 240, startSize: 68, minSize: 34, color: "#333333" },
      team: { x: 118, y: 376, maxWidth: 790, startSize: 46, minSize: 24, color: "#333333" },

      et: { x: 1005, emailY: 316, phoneY: 396, size: 44, color: "#333333" },

      email: { x: 1074, y: 316, maxWidth: 460, startSize: 42, minSize: 22, color: "#333333" },
      phone: { x: 1074, y: 396, maxWidth: 460, startSize: 42, minSize: 22, color: "#333333" },
      address: { x: 118, y: 522, maxWidth: 1370, startSize: 40, minSize: 22, color: "#333333" },

      characterBox: { x: 1570, y: 150, w: 360, h: 430 }
    };

    function makeCharacters() {
      const list = [];

      for (let i = 1; i <= 41; i++) {
        const num = String(i).padStart(2, "0");
        list.push({
          category: "hanyangi",
          label: `하냥이 ${num}`,
          file: `assets/chars/hanyangi_${num}.png`
        });
      }

      for (let i = 1; i <= 11; i++) {
        const num = String(i).padStart(2, "0");
        list.push({
          category: "college",
          label: `단과대학 하냥이 ${num}`,
          file: `assets/chars/college_${num}.png`
        });
      }

      for (let i = 1; i <= 24; i++) {
        const num = String(i).padStart(2, "0");
        list.push({
          category: "hibibi",
          label: `하이비비 ${num}`,
          file: `assets/chars/hibibi_${num}.png`
        });
      }

      return list;
    }

    const characters = makeCharacters();

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const elLogoType = document.getElementById("logoType");
    const elName = document.getElementById("name");
    const elTitle = document.getElementById("title");
    const elTeam = document.getElementById("team");
    const elEmail = document.getElementById("email");
    const elPhone = document.getElementById("phone");
    const elAddress = document.getElementById("address");
    const elCategory = document.getElementById("category");
    const elCharacter = document.getElementById("character");
    const elCharPreview = document.getElementById("charPreview");
    const elCharCountInfo = document.getElementById("charCountInfo");

    const elBoldName = document.getElementById("boldName");
    const elBoldTitle = document.getElementById("boldTitle");
    const elBoldTeam = document.getElementById("boldTeam");
    const elBoldContact = document.getElementById("boldContact");
    const elBoldAddress = document.getElementById("boldAddress");

    const elNameOffsetX = document.getElementById("nameOffsetX");
    const elNameOffsetY = document.getElementById("nameOffsetY");
    const elNameScale = document.getElementById("nameScale");
    const elNameOffsetXValue = document.getElementById("nameOffsetXValue");
    const elNameOffsetYValue = document.getElementById("nameOffsetYValue");
    const elNameScaleValue = document.getElementById("nameScaleValue");

    const elCharOffsetX = document.getElementById("charOffsetX");
    const elCharOffsetY = document.getElementById("charOffsetY");
    const elCharScale = document.getElementById("charScale");
    const elCharOffsetXValue = document.getElementById("charOffsetXValue");
    const elCharOffsetYValue = document.getElementById("charOffsetYValue");
    const elCharScaleValue = document.getElementById("charScaleValue");

    const templateImg = new Image();
    let selectedCharImg = new Image();
    let filteredCharacters = [];
    const logoImages = {};

    function getWeight(checked, bold = 700, normal = 400) {
      return checked ? bold : normal;
    }

    function getNameWeight() {
      return elBoldName.checked ? 800 : 500;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("이미지 로드 실패: " + src));
        img.src = src;
      });
    }

    function setFont(weight, size) {
      ctx.font = `${weight} ${size}px ${FONT_FAMILY}`;
    }

    function fitFontSize(text, maxWidth, startSize, minSize, weight) {
      let size = startSize;
      const safeText = text || "";

      while (size >= minSize) {
        setFont(weight, size);
        if (ctx.measureText(safeText).width <= maxWidth) return size;
        size--;
      }

      return minSize;
    }

    function drawTextOneLine(text, opt, weight) {
      const finalText = (text || " ").trim() || " ";
      const size = fitFontSize(finalText, opt.maxWidth, opt.startSize, opt.minSize, weight);

      ctx.fillStyle = opt.color;
      ctx.textBaseline = "top";
      setFont(weight, size);
      ctx.fillText(finalText, opt.x, opt.y);
    }

    function drawNameText(text, opt) {
      const finalText = (text || " ").trim() || " ";
      const offsetX = Number(elNameOffsetX.value);
      const offsetY = Number(elNameOffsetY.value);
      const scale = Number(elNameScale.value) / 100;
      const weight = getNameWeight();

      let startSize = opt.startSize;
      let minSize = opt.minSize;
      let maxWidth = opt.maxWidth;

      const hasEnglish = /[A-Za-z]/.test(finalText);

      if (hasEnglish) {
        startSize -= 18;
        minSize -= 4;
        maxWidth += 60;
      } else if (finalText.length >= 4) {
        startSize -= 12;
      }

      drawTextOneLine(finalText, {
        ...opt,
        x: opt.x + offsetX,
        y: opt.y + offsetY,
        startSize: Math.round(startSize * scale),
        minSize: Math.max(18, Math.round(minSize * scale)),
        maxWidth: maxWidth
      }, weight);
    }

    function drawET() {
      const weight = getWeight(elBoldContact.checked, 700, 400);

      ctx.fillStyle = CONFIG.et.color;
      ctx.textBaseline = "top";
      setFont(weight, CONFIG.et.size);
      ctx.fillText("E", CONFIG.et.x, CONFIG.et.emailY);
      ctx.fillText("T", CONFIG.et.x, CONFIG.et.phoneY);
    }

    function getTrimRect(img, trimWhite = true) {
      const tempCanvas = document.createElement("canvas");
      const tempCtx = tempCanvas.getContext("2d");

      tempCanvas.width = img.width;
      tempCanvas.height = img.height;
      tempCtx.drawImage(img, 0, 0);

      const data = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height).data;

      let minX = tempCanvas.width;
      let minY = tempCanvas.height;
      let maxX = 0;
      let maxY = 0;
      let found = false;

      for (let y = 0; y < tempCanvas.height; y++) {
        for (let x = 0; x < tempCanvas.width; x++) {
          const idx = (y * tempCanvas.width + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          const a = data[idx + 3];

          const transparent = a < 10;
          const white = trimWhite && r > 248 && g > 248 && b > 248;

          if (!transparent && !white) {
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
            found = true;
          }
        }
      }

      if (!found) {
        return { sx: 0, sy: 0, sw: img.width, sh: img.height };
      }

      const p = 8;
      minX = Math.max(0, minX - p);
      minY = Math.max(0, minY - p);
      maxX = Math.min(tempCanvas.width, maxX + p);
      maxY = Math.min(tempCanvas.height, maxY + p);

      return {
        sx: minX,
        sy: minY,
        sw: maxX - minX,
        sh: maxY - minY
      };
    }

    function drawTrimmedInBox(img, box, trimWhite = true) {
      const t = getTrimRect(img, trimWhite);
      const scale = Math.min(box.w / t.sw, box.h / t.sh);

      const drawW = t.sw * scale;
      const drawH = t.sh * scale;
      const drawX = box.x + (box.w - drawW) / 2;
      const drawY = box.y + (box.h - drawH) / 2;

      ctx.drawImage(img, t.sx, t.sy, t.sw, t.sh, drawX, drawY, drawW, drawH);
    }

    function drawContainTrimmedCharacter(img, box) {
      const t = getTrimRect(img, true);

      const scaleInput = Number(elCharScale.value) / 100;
      const offsetX = Number(elCharOffsetX.value);
      const offsetY = Number(elCharOffsetY.value);

      const baseScale = Math.min(box.w / t.sw, box.h / t.sh);
      const scale = baseScale * scaleInput;

      const drawW = t.sw * scale;
      const drawH = t.sh * scale;
      const drawX = box.x + (box.w - drawW) / 2 + offsetX;
      const drawY = box.y + (box.h - drawH) / 2 + offsetY;

      ctx.drawImage(img, t.sx, t.sy, t.sw, t.sh, drawX, drawY, drawW, drawH);
    }

    function drawLogo() {
      const type = elLogoType.value;

      if (type === "none") return;

      const img = logoImages[type];
      const box = CONFIG.logos[type];

      if (!img || !box) return;

      drawTrimmedInBox(img, box, false);
    }

    function drawCard() {
      if (!templateImg.complete) return;

      ctx.clearRect(0, 0, CONFIG.width, CONFIG.height);
      ctx.drawImage(templateImg, 0, 0, CONFIG.width, CONFIG.height);

      drawLogo();

      drawNameText(elName.value, CONFIG.name);

      drawTextOneLine(
        elTitle.value,
        CONFIG.title,
        getWeight(elBoldTitle.checked, 700, 400)
      );

      drawTextOneLine(
        elTeam.value,
        CONFIG.team,
        getWeight(elBoldTeam.checked, 700, 400)
      );

      drawET();

      drawTextOneLine(
        elEmail.value,
        CONFIG.email,
        getWeight(elBoldContact.checked, 700, 400)
      );

      drawTextOneLine(
        elPhone.value,
        CONFIG.phone,
        getWeight(elBoldContact.checked, 700, 400)
      );

      drawTextOneLine(
        elAddress.value,
        CONFIG.address,
        getWeight(elBoldAddress.checked, 700, 400)
      );

      if (selectedCharImg && selectedCharImg.complete && selectedCharImg.naturalWidth > 0) {
        drawContainTrimmedCharacter(selectedCharImg, CONFIG.characterBox);
      }
    }

    function refreshCharacterOptions(keepFile = null) {
      const category = elCategory.value;

      filteredCharacters = characters.filter(c => {
        return category === "all" || c.category === category;
      });

      elCharacter.innerHTML = "";

      filteredCharacters.forEach((char, index) => {
        const option = document.createElement("option");
        option.value = char.file;
        option.textContent = char.label;

        if (keepFile && char.file === keepFile) {
          option.selected = true;
        } else if (!keepFile && index === 0) {
          option.selected = true;
        }

        elCharacter.appendChild(option);
      });

      elCharCountInfo.textContent = `현재 분류 ${filteredCharacters.length}종 / 전체 ${characters.length}종`;
    }

    async function updateCharacterAndDraw() {
      try {
        const src = elCharacter.value;
        selectedCharImg = await loadImage(src);
        elCharPreview.src = src;
        drawCard();
      } catch (err) {
        console.error(err);
      }
    }

    function moveCharacter(direction) {
      if (!filteredCharacters.length) return;

      let idx = filteredCharacters.findIndex(c => c.file === elCharacter.value);

      if (idx < 0) idx = 0;

      idx += direction;

      if (idx < 0) idx = filteredCharacters.length - 1;
      if (idx >= filteredCharacters.length) idx = 0;

      elCharacter.value = filteredCharacters[idx].file;
      updateCharacterAndDraw();
    }

    function updateRangeLabels() {
      elNameOffsetXValue.textContent = elNameOffsetX.value;
      elNameOffsetYValue.textContent = elNameOffsetY.value;
      elNameScaleValue.textContent = elNameScale.value;

      elCharOffsetXValue.textContent = elCharOffsetX.value;
      elCharOffsetYValue.textContent = elCharOffsetY.value;
      elCharScaleValue.textContent = elCharScale.value;
    }

    function trackDownloadEvent() {
      if (typeof gtag !== "function") return;

      gtag("event", "png_download", {
        event_category: "mail_card",
        event_label: elLogoType.value,
        character: elCharacter.options[elCharacter.selectedIndex]?.textContent || "",
        name_length: elName.value.trim().length
      });
    }

    function downloadPNG() {
      trackDownloadEvent();

      const fileBase = (elName.value || "mail-card").trim().replace(/\s+/g, "_");
      const link = document.createElement("a");
      link.download = `${fileBase}_mail_card.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function resetDefaults() {
      elLogoType.value = "erica";

      elName.value = "하냥이";
      elTitle.value = "귀여움";
      elTeam.value = "한양대학교 ERICA 하냥처 | 하냥팀";
      elEmail.value = "hyangi@hanyang.ac.kr";
      elPhone.value = "031-400-9999";
      elAddress.value = "경기도 안산시 상록구 한양대학로 55 ERICA 캣타워";

      elBoldName.checked = true;
      elBoldTitle.checked = true;
      elBoldTeam.checked = true;
      elBoldContact.checked = true;
      elBoldAddress.checked = true;

      elCategory.value = "all";
      refreshCharacterOptions();

      elNameOffsetX.value = 0;
      elNameOffsetY.value = 0;
      elNameScale.value = 100;

      elCharOffsetX.value = 0;
      elCharOffsetY.value = 0;
      elCharScale.value = 100;

      updateRangeLabels();
      updateCharacterAndDraw();
      drawCard();
    }

    function bindEvents() {
      [elName, elTitle, elTeam, elEmail, elPhone, elAddress].forEach(el => {
        el.addEventListener("input", drawCard);
      });

      [elBoldName, elBoldTitle, elBoldTeam, elBoldContact, elBoldAddress].forEach(el => {
        el.addEventListener("change", drawCard);
      });

      elLogoType.addEventListener("change", drawCard);

      elCategory.addEventListener("change", () => {
        refreshCharacterOptions();
        updateCharacterAndDraw();
      });

      elCharacter.addEventListener("change", updateCharacterAndDraw);

      document.getElementById("prevBtn").addEventListener("click", () => moveCharacter(-1));
      document.getElementById("nextBtn").addEventListener("click", () => moveCharacter(1));

      [elNameOffsetX, elNameOffsetY, elNameScale, elCharOffsetX, elCharOffsetY, elCharScale].forEach(el => {
        el.addEventListener("input", () => {
          updateRangeLabels();
          drawCard();
        });
      });

      document.getElementById("downloadBtn").addEventListener("click", downloadPNG);
      document.getElementById("resetBtn").addEventListener("click", resetDefaults);
    }

    async function init() {
      bindEvents();
      refreshCharacterOptions();
      updateRangeLabels();

      templateImg.src = "assets/template.png";

      await new Promise((resolve, reject) => {
        templateImg.onload = resolve;
        templateImg.onerror = reject;
      });

      logoImages.erica = await loadImage(CONFIG.logos.erica.src);
      logoImages.hanyang = await loadImage(CONFIG.logos.hanyang.src);

      await updateCharacterAndDraw();

      drawCard();
    }

    init().catch(err => {
      console.error(err);
      alert("초기화 실패. assets/template.png, 로고, 캐릭터 파일 경로를 확인해봐.");
    });
  </script>
</body>
</html>
